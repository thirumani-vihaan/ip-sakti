services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8000:8000"]
    environment:
      CORPUS_DIR: /app/corpus
      # Live mode (optional): export these in your shell (or a .env beside this file) before 'docker compose up'.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BHASHINI_USER_ID: ${BHASHINI_USER_ID:-}
      BHASHINI_ULCA_API_KEY: ${BHASHINI_ULCA_API_KEY:-}
      BHASHINI_INFERENCE_API_KEY: ${BHASHINI_INFERENCE_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["5173:80"]
    depends_on:
      backend:
        condition: service_healthy

  chromadb:
    image: chromadb/chroma:latest
    ports: ["8001:8000"]
    volumes: ["chroma_data:/chroma/chroma"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chroma_data:


