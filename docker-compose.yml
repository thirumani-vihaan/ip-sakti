services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Not published to the host: only the frontend nginx reaches it (so the trusted
    # X-Forwarded-For hop cannot be forged by bypassing the proxy). Use a tunnel or
    # `docker compose exec` for direct backend access during development.
    expose: ["8000"]
    environment:
      CORPUS_DIR: /app/corpus
      # The frontend nginx proxies /api to this service; trust its X-Forwarded-For hop.
      TRUST_PROXY: "1"
      # Live mode (optional): export these in your shell (or a .env beside this file) before 'docker compose up'.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BHASHINI_USER_ID: ${BHASHINI_USER_ID:-}
      BHASHINI_ULCA_API_KEY: ${BHASHINI_ULCA_API_KEY:-}
      BHASHINI_INFERENCE_API_KEY: ${BHASHINI_INFERENCE_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["5173:80"]
    depends_on:
      backend:
        condition: service_healthy

